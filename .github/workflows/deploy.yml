name: Build and publish dashboard

on:
  push:
    branches: [main]
  schedule:
    # Every 15 minutes. Free and unlimited: Actions only bills private repos.
    #
    # Deliberately not */15, which fires on the hour - GitHub names the start of
    # every hour as its peak load window and delays scheduled runs then. These
    # offsets sit in the quiet part of the hour instead.
    #
    # Note: on a public repo GitHub disables scheduled workflows after 60 days
    # with no repository activity. It emails first, and any push resets the
    # clock; the Actions tab also has a Run workflow button.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        # Not on the runner image by default. Without it build.py publishes the
        # 320 kbps masters, which is three times the download for no gain.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Render the dashboard
        # No Python dependencies to install - main.py is standard library only.
        run: python build.py

      - name: Check it actually rendered
        run: |
          python - <<'PY'
          import io, os, re, sys
          page = io.open("docs/index.html", encoding="utf-8").read()
          problems = []
          if len(page) < 40000:
              problems.append("page is suspiciously small (%d bytes)" % len(page))
          if page.count('class="lane"') != 3:
              problems.append("expected 3 club lanes, found %d" % page.count('class="lane"'))
          if "Could not load" in page:
              problems.append("a club failed to load from ESPN")

          # Hover-to-play needs the audio beside the page. A club that lost has
          # no anthem at all, which is correct - so only check what is linked.
          if 'data-anthem="browser"' in page:
              problems.append("page is asking viewers for their own audio")
          linked = re.findall(r'src="anthems/([^"]+)"', page)
          for name in linked:
              path = os.path.join("docs", "anthems", name)
              if not os.path.isfile(path) or os.path.getsize(path) == 0:
                  problems.append("anthem linked but not published: %s" % name)

          if problems:
              print("\n".join("  - " + p for p in problems))
              sys.exit(1)
          print("looks good: %d bytes, %d lanes, %d anthem(s) playable"
                % (len(page), page.count('class="lane"'), len(linked)))
          for name in linked:
              mb = os.path.getsize(os.path.join("docs", "anthems", name)) / 1048576.0
              print("  %s  %.1f MB%s" % (name, mb, "  (not re-encoded?)" if mb > 4 else ""))
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
